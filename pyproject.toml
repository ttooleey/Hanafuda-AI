[project]
name = "koikoi-ai"
version = "0.1.0"
description = "KoiKoi (花札) AI with machine learning"
readme = "README.md"
requires-python = ">=3.9,<3.10"
license = "MIT"
authors = [
    { name = "guansanghai" }
]
dependencies = [
    "numpy>=1.21.0,<2.0.0",
    "torch==1.8.1",
    "FreeSimpleGUI>=5.0.0",
    "matplotlib>=3.4.0",
    "networkx>=2.6.0",
    "pandas>=1.3.0",
    "scikit-learn>=0.24.0",
    "seaborn>=0.11.0",
]

[project.optional-dependencies]
dev = [
    "ipykernel",
    "jupyter",
]

[dependency-groups]
dev = [
    "ipykernel>=6.0.0",
    "jupyter>=1.0.0",
]
