[project]
name = "koikoi-ai"
version = "0.2.0"
description = "KoiKoi (花札) AI with Transformer-based machine learning"
readme = "README.md"
requires-python = ">=3.9,<3.10"
license = "MIT"
authors = [
    { name = "guansanghai" }
]
keywords = [
    "hanafuda",
    "koikoi",
    "card-game",
    "transformer",
    "reinforcement-learning",
    "ai"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.9",
    "Topic :: Games/Entertainment :: Board Games",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.21.0,<2.0.0",
    "torch==1.8.1",
    "FreeSimpleGUI>=5.0.0",
    "matplotlib>=3.4.0",
    "networkx>=2.6.0",
    "pandas>=1.3.0",
    "scikit-learn>=0.24.0",
    "seaborn>=0.11.0",
]

[project.optional-dependencies]
dev = [
    "ipykernel",
    "jupyter",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
koikoi-play = "scripts.play_game:main"

[dependency-groups]
dev = [
    "ipykernel>=6.0.0",
    "jupyter>=1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["koikoi*"]
